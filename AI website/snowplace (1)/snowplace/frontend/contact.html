<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Contact | There's Snow Place Like Home</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="theme-farm">
<div id="nav-placeholder"></div>

<div class="page-header" data-emoji="📬">
  <div class="container">
    <div class="tag">Get In Touch</div>
    <h1>Contact Us</h1>
    <p>Questions about the game? Feedback for the team? Drop us a message below.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="two-col">
      <div class="reveal-left">
        <div style="background:#fff;border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow-lg);max-width:560px;">
          <div class="tag">Send a Message</div>
          <h2 style="font-size:1.4rem;font-weight:800;color:var(--blue-dark);margin-bottom:20px;">We'd Love to Hear From You</h2>
          <div id="contactMsg" class="form-msg"></div>
          <form class="contact-form" id="contactForm" onsubmit="submitContact(event)">
            <div class="form-group">
              <label for="cName">Your Name *</label>
              <input type="text" id="cName" name="name" placeholder="Enter your name" required maxlength="100"/>
            </div>
            <div class="form-group">
              <label for="cEmail">Email Address *</label>
              <input type="email" id="cEmail" name="email" placeholder="your@email.com" required maxlength="200"/>
            </div>
            <div class="form-group">
              <label for="cSubject">Subject *</label>
              <input type="text" id="cSubject" name="subject" placeholder="What's this about?" required maxlength="200"/>
            </div>
            <div class="form-group">
              <label for="cMessage">Message *</label>
              <textarea id="cMessage" name="message" placeholder="Type your message here..." required maxlength="2000"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="cSubmitBtn">📬 Send Message</button>
          </form>
        </div>
      </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>

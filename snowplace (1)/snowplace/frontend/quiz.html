<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quiz | Snow Place Like Home</title>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="theme-jungle">
<div id="nav-placeholder"></div>

<div class="page-header" data-emoji="🎯">
  <div class="container">
    <div class="tag">Test Yourself</div>
    <h1>The Quiz</h1>
    <p>How much do you know about Snow Place Like Home? 15 questions — let's find out!</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="quiz-wrap" id="quizWrap">
      <div class="quiz-prog-bar"><div class="quiz-prog-fill" id="qFill" style="width:0%"></div></div>
      <div class="quiz-meta">
        <span class="q-counter" id="qCounter">Question 1 of 15</span>
        <span class="q-score-display" id="qScoreDisplay">Score: 0</span>
      </div>
      <p class="q-text" id="qText"></p>
      <div class="q-opts" id="qOpts"></div>
      <div class="q-exp" id="qExp"></div>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn-q-next" id="btnNext">Next →</button>
      </div>

      <!-- RESULT -->
      <div class="quiz-result" id="qResult">
        <div style="font-size:3.5rem;margin-bottom:8px;">🐧</div>
        <div class="res-score" id="resScore">0/15</div>
        <div class="res-badge" id="resBadge">Penguin Beginner!</div>
        <div class="res-title" id="resTitle">Quiz Complete!</div>
        <p class="res-sub" id="resSub"></p>
        <!-- Optional: save result -->
        <div style="background:rgba(255,255,255,.08);border-radius:12px;padding:20px;margin:20px 0;text-align:left;">
          <p style="color:rgba(255,255,255,.7);font-size:.85rem;margin-bottom:10px;">Save your result to the leaderboard (optional):</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <input type="text" id="quizName" placeholder="Your name" style="flex:1;min-width:140px;padding:9px 14px;border-radius:8px;border:none;font-size:.9rem;"/>
            <button class="btn btn-gold btn-sm" onclick="saveQuizResult()">💾 Save</button>
          </div>
          <p id="quizSaveMsg" style="font-size:.82rem;margin-top:8px;color:rgba(255,255,255,.6);"></p>
        </div>
        <button class="btn btn-gold" onclick="restartQuiz()">🔄 Try Again</button>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
